model:
  path: ${MODEL_PATH:-models/best.pt}
  device: ${DEVICE:-auto}
  confidence_threshold: ${CONFIDENCE_THRESHOLD:-0.35}
  iou_threshold: ${IOU_THRESHOLD:-0.45}
  imgsz: 640

inference:
  target_inference_fps: ${TARGET_FPS:-10}

tracking:
  enabled: true
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  # track_buffer: how many frames a lost track stays alive before expiring.
  # At 10 FPS: 40 frames = 4 seconds of occlusion tolerance.
  track_buffer: 40
  # match_thresh: minimum IoU to link a detection to an existing track.
  # ROOT CAUSE FIX: default 0.7 causes ID switches when a person moves ~20px
  # on a 100px-wide box (IoU=0.667 < 0.7 -> no match -> new ID).
  # 0.35 is stable for movement up to ~50px between frames at 10 FPS.
  match_thresh: 0.35
  min_hits: 1

association:
  min_iou: 0.05
  min_containment: 0.25
  center_in_region: true
  min_score: 0.25
  head_height_ratio: 0.35
  torso_y_start: 0.20
  torso_y_end: 0.75
  # Relative rank gap that decides Hardhat vs NO-Hardhat (and mask/vest).
  # Below this margin, higher detector confidence wins; exact ties prefer present.
  conflict_margin: 0.15
  prefer_positive_on_tie: true
  regions:
    helmet: head
    mask: head
    safety_vest: torso

visualization:
  # person_summary | minimal | debug
  mode: minimal
  show_raw_detections: false
  show_person_id: true
  show_ppe_status: true
  show_overall_status: true
  crowd_compact_threshold: 8
  label_above_box: true
  # Consecutive frames of the same PPE polarity before the overlay/state flips.
  stable_frames: 3
  hud_violation_rows: 8

# Canonical PPE names used by compliance. Aliases are matched
# case-insensitively against the loaded model's actual class names.
class_taxonomy:
  person_labels:
    - Person
    - person
    - people
  ppe:
    helmet:
      positive: [Hardhat, Helmet, helmet, hardhat, Hard-Hat]
      negative: [NO-Hardhat, No-Hardhat, NO-Helmet, No-Helmet, no-hardhat]
    mask:
      positive: [Mask, mask, Face-mask, Face Mask]
      negative: [NO-Mask, No-Mask, no-mask]
    safety_vest:
      positive: [Safety Vest, safety vest, Vest, Safety-Vest]
      negative: [NO-Safety Vest, No-Safety Vest, NO-Safety-Vest, no-safety-vest]

# V1 uses a single zone. Only include classes the current model supports.
zones:
  general:
    required_ppe:
      - helmet
      - safety_vest
      - mask

violations:
  confirmation_seconds: ${VIOLATION_CONFIRMATION_SECONDS:-3}
  cooldown_seconds: ${VIOLATION_COOLDOWN_SECONDS:-30}

evidence:
  directory: evidence
  retention_days: 30
  jpeg_quality: 90
  events_jsonl: evidence/events.jsonl
  # Cooldown between repeated evidence captures for the same worker + violation.
  cooldown_seconds: ${EVIDENCE_COOLDOWN_SECONDS:-30}
  # Allow periodic evidence if a confirmed violation remains active past cooldown.
  repeat_active_violations: true

logging:
  level: ${LOG_LEVEL:-INFO}

dashboard:
  sqlite_path: data/ppe.sqlite
  live_dir: data/live
  # Browser live view is JPEG polling (not RTSP). Keep this ≤500ms for smoother UI.
  poll_interval_ms: ${DASHBOARD_POLL_MS:-500}
  # Non-blocking in-memory snapshot refresh rate (~8 FPS)
  snapshot_poll_interval_ms: ${SNAPSHOT_POLL_MS:-120}
  mock_data: false
  host: ${DASHBOARD_HOST:-127.0.0.1}
  port: ${DASHBOARD_PORT:-8000}
